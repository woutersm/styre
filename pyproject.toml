[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "styre"
dynamic = ["version"]      # one source of truth: styre/__init__.py
description = "An overnight phase orchestrator for the pi coding agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # stdlib only, deliberately

[project.scripts]
styre = "styre.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["styre"]

[tool.setuptools.package-data]
# The pi extensions styre passes to every pi process with --extension (see styre/pi_extensions/).
styre = ["pi_extensions/*.js"]

[tool.setuptools.dynamic]
version = {attr = "styre.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
