[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "styre"
dynamic = ["version"]      # one source of truth: styre/__init__.py
description = "Run a phased design through the pi coding agent overnight: one fresh process and one commit per phase, gated by your own tests"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martijn Wouters", email = "martijn@wouters.dev" }]
keywords = ["coding-agent", "orchestrator", "pi", "llm", "automation", "overnight"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []          # stdlib only, deliberately

[project.urls]
Homepage = "https://github.com/woutersm/styre"
Source = "https://github.com/woutersm/styre"
Issues = "https://github.com/woutersm/styre/issues"

[project.scripts]
styre = "styre.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["styre"]

[tool.setuptools.package-data]
# The pi extensions styre passes to every pi process with --extension (see styre/pi_extensions/).
styre = ["pi_extensions/*.js"]

[tool.setuptools.dynamic]
version = {attr = "styre.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
